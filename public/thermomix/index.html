<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thermomix | הזמנת אוכל</title>
    <meta name="description" content="מתכון לתרמומיקס ורשימת קניות עם השוואת מחירים" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/alef-he-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body data-page="thermomix">
    <main class="page">
      <a class="back" href="/">→ חזרה</a>
      <h1 dir="ltr">Thermomix</h1>
      <p class="lead">מה מכינים? העתיקו את המצרכים מהמתכון והדביקו כאן.</p>

      <label class="field">
        <span>שם המתכון (לא חובה)</span>
        <input id="title" type="text" maxlength="100" autocomplete="off" />
      </label>
      <label class="field">
        <span>המצרכים, מצרך בכל שורה</span>
        <textarea id="ingredients" rows="9" placeholder="2 כוסות קמח&#10;3 ביצים&#10;500 גרם חזה עוף"></textarea>
      </label>

      <button class="shop" id="shop" type="button" disabled>🛒 קנה מצרכים</button>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
